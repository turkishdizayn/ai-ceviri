name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Çekirdek birim testleri
        run: ./gradlew :core:test --stacktrace

      - name: Android derleme (debug APK) + lint
        run: ./gradlew :app:assembleDebug :app:lintDebug --stacktrace

      - name: Test raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporlari
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: ai-ceviri-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # main'e her push'ta APK bir GitHub Release'e eklenir.
      # Sabit indirme linki: https://github.com/<repo>/releases/latest/download/ai-ceviri.apk
      - name: İndirme linki için Release oluştur
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ai-ceviri.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" ai-ceviri.apk \
            --target "${{ github.sha }}" \
            --title "AI Çeviri — derleme ${{ github.run_number }}" \
            --notes "Otomatik derleme. Commit: ${{ github.sha }}" \
            --latest
